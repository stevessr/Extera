  msix: ^3.6.13
  translations_cleaner: ^0.2.1

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  image: "assets/info-logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - assets/sounds/ringtones/
    - assets/font/
    - assets/vodozemac/
    # Populated by tool/download_animated_emoji.dart, see .gitignore.
    - assets/animated_emoji/
