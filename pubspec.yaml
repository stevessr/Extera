  flutter_vodozemac: ^0.7.1
  flutter_web_auth_2: ^5.0.1
  flutter_webrtc: 1.6.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  handy_window: ^0.4.2
  highlight_selectable: ^0.2.1
