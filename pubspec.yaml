  web: ^1.1.1
  webrtc_interface: ^1.5.1
  webview_flutter: ^4.14.1
  desktop_webview_window: ^0.3.0
  dio: ^5.11.0
  uuid: ^4.6.0
  flutter_ringtone_player: ^4.0.0+4
  audioplayers_linux: ^4.3.0
  pro_image_editor: ^13.3.1
  google_fonts: ^8.2.1
  marquee: ^2.3.0
  particles_network: ^1.9.5
  flutter_material_design_icons: ^3.1.0+7447
  open_file: ^4.0.0
  phone_numbers_parser: ^9.0.25
  defer_pointer: ^0.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  integration_test:
    sdk: flutter
  license_checker: ^1.6.2
  msix: ^3.18.0
  translations_cleaner: ^0.2.1
  tidy_imports: ^1.3.0
  url_launcher_platform_interface: ^2.3.2

# Generated localization files are owned by flutter gen-l10n.
tidy_imports:
  comments: false
  separate_relative_imports: true
  ignored_files:
    - /lib/generated/l10n/
    - /lib/pages/settings_emotes/settings_emotes.dart

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  image: "assets/info-logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - assets/sounds/ringtones/
    - assets/font/
    - assets/font/ufs/
    - assets/vodozemac/
    # Populated by tool/download_animated_emoji.dart, see .gitignore.
    - assets/animated_emoji/
  fonts:
    - family: "Roboto"
      fonts:
        - asset: assets/font/RobotoVariable.ttf
          style: normal
        - asset: assets/font/RobotoItalicVariable.ttf
          style: italic
    - family: "Roboto Mono"
      fonts:
        - asset: assets/font/RobotoMonoVariable.ttf

msix_config:
  display_name: Extera Next
  publisher_display_name: Extera Next
  publisher: CN=Extera, O=HQ of bad forks of good things, L=Matrix, S=Internet, C=RU
  identity_name: xyz.extera.next
  logo_path: assets\logo.png
  capabilities: internetClient, location, microphone, webcam
  protocol_activation: https
  app_uri_handler_hosts: extera.xyz, fluffychat.im, matrix.to
  execution_alias: exteranext
  sign_msix: false
  install_certificate: false

dependency_overrides:
  # The published package schedules a post-frame callback without checking
  # whether a dismissed message is still mounted.
  swipe_to_action:
    path: packages/swipe_to_action
  # Upstream still imports dart:html, which dart2wasm cannot compile.
  flutter_keyboard_visibility_web:
    path: packages/flutter_keyboard_visibility_web
# Published FRB 2.11/vodozemac 0.5 bindings are not dart2wasm-safe yet.
# Keep the entire bridge stack on the matching upstream Wasm fix until it is
# released; vodozemac's generated Dart code and Rust/Wasm artifacts must agree.
  flutter_vodozemac:
    git:
      url: https://github.com/famedly/dart-vodozemac.git
      ref: krille/frb-wasm-fix
      path: flutter
  flutter_rust_bridge:
    git:
      url: https://github.com/fzyzcjy/flutter_rust_bridge.git
      ref: ba8d019eb374e70a6c144adc2c160772c0417e0c
      path: frb_dart
  vodozemac:
    git:
      url: https://github.com/famedly/dart-vodozemac.git
      ref: krille/frb-wasm-fix
      path: dart
