name: Format emoji fix

on:
  push:
    branches:
      - fix/emoji-loading-reliability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-loading-reliability
      - uses: ./.github/actions/setup-flutter
      - name: Format
        run: dart format lib/widgets/emoji_picker.dart
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/emoji_picker.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format emoji loading fix'
          git push origin HEAD:fix/emoji-loading-reliability
