name: Apply reaction picker IME fix

on:
  push:
    branches:
      - fix/reaction-picker-ime-rise
    paths:
      - .github/workflows/tmp-reaction-ime-fix.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/reaction-picker-ime-rise

      - name: Patch reaction emoji pickers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('lib/pages/chat/events/message_reactions.dart'),
              Path('lib/pages/chat/message_context_menu.dart'),
          ]

          for path in paths:
              text = path.read_text()
              marker = 'showAdaptiveBottomSheet<String>('
              marker_index = text.find(marker)
              if marker_index < 0:
                  raise SystemExit(f'{path}: reaction picker bottom sheet not found')

              scaffold = 'builder: (context) => Scaffold(\n'
              scaffold_index = text.find(scaffold, marker_index)
              if scaffold_index < 0:
                  raise SystemExit(f'{path}: reaction picker Scaffold not found')

              insert_at = scaffold_index + len(scaffold)
              if text.startswith('resizeToAvoidBottomInset:', insert_at):
                  continue

              line_start = text.rfind('\n', 0, scaffold_index) + 1
              indent = text[line_start:scaffold_index]
              text = (
                  text[:insert_at]
                  + f'{indent}  resizeToAvoidBottomInset: false,\n'
                  + text[insert_at:]
              )
              path.write_text(text)

          PY

      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -c 'resizeToAvoidBottomInset: false' lib/pages/chat/events/message_reactions.dart)" -eq 1
          test "$(grep -c 'resizeToAvoidBottomInset: false' lib/pages/chat/message_context_menu.dart)" -eq 1

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/pages/chat/events/message_reactions.dart lib/pages/chat/message_context_menu.dart
          git commit -m 'fix(chat): keep reaction picker stable during IME animation'
          git push origin HEAD:fix/reaction-picker-ime-rise
