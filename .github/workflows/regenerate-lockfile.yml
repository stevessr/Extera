name: Regenerate dependency lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
          pub-cache: false

      - name: Regenerate lockfile
        run: flutter pub get --no-example

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock is already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'chore: regenerate dependency lockfile'
          git push origin HEAD:main
