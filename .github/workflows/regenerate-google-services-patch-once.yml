name: Regenerate Google services patch once

on:
  push:
    branches:
      - fix/android-avif-web-ci
    paths:
      - .github/workflows/regenerate-google-services-patch-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-avif-web-ci

      - name: Generate patch from current sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          old = '  #fcm_shared_isolate: ^0.2.0\n'
          new = '  fcm_shared_isolate: ^0.2.0\n'
          if old not in text:
              raise SystemExit('FCM dependency marker not found')
          pubspec.write_text(text.replace(old, new, 1))

          background = Path('lib/utils/background_push.dart')
          text = background.read_text()
          marker = '//<GOOGLE_SERVICES>'
          count = text.count(marker)
          if count == 0:
              raise SystemExit('Google services source markers not found')
          background.write_text(text.replace(marker, ''))
          print(f'Enabled {count} Google services source markers')
          PY
          git diff -- lib/utils/background_push.dart pubspec.yaml > /tmp/google-services.patch
          git restore -- lib/utils/background_push.dart pubspec.yaml
          cp /tmp/google-services.patch scripts/enable-android-google-services.patch
          git apply --check scripts/enable-android-google-services.patch

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          channel: stable
          cache: true

      - name: Validate optional Google services configuration
        run: |
          git apply scripts/enable-android-google-services.patch
          rm -rf .dart_tool
          flutter pub get --no-example
          flutter analyze

      - name: Commit regenerated patch
        run: |
          git restore -- lib/utils/background_push.dart pubspec.yaml pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enable-android-google-services.patch
          git commit -m "ci: refresh Google services analyzer patch"
          git push origin HEAD:fix/android-avif-web-ci
