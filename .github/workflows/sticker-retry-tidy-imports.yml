name: Temporary tidy Dart imports
on:
  push:
    branches: [fix/sticker-retry-preserve-event-type]
    paths:
      - '.github/workflows/sticker-retry-tidy-imports.yml'
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/sticker-retry-preserve-event-type
      - uses: ./.github/actions/setup-flutter
      - name: Fix imports and format
        shell: bash
        run: |
          set -euo pipefail
          dart run tidy_imports --no-comments
          dart format lib/ test/ integration_test/ packages/swipe_to_action/lib/
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/ test/ integration_test/ packages/swipe_to_action/lib/
            git commit -m "style: normalize existing Dart imports for CI"
            git push origin HEAD:fix/sticker-retry-preserve-event-type
          fi
