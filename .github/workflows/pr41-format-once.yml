name: PR 41 one-time Dart formatter
on:
  push:
    branches:
      - fix/muted-thread-read-marker
    paths:
      - .github/workflows/pr41-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/muted-thread-read-marker
      - uses: ./.github/actions/setup-flutter
      - name: Format Dart source and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/ test/ integration_test/
          git add -u -- lib/ test/ integration_test/
          git rm -- .github/workflows/pr41-format-once.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format Dart sources for PR 41"
          git push origin HEAD:fix/muted-thread-read-marker
