name: Format stable MSC implementation

on:
  push:
    branches:
      - fix/stable-profile-fields-rich-topic

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stable-profile-fields-rich-topic
      - uses: ./.github/actions/setup-flutter
      - name: Format changed stable MSC files
        run: |
          dart format \
            lib/pages/settings/settings.dart \
            lib/utils/profile_field_capabilities.dart \
            lib/utils/stable_room_topic.dart \
            test/utils/profile_field_capabilities_test.dart
          rm .github/workflows/format-stable-msc.yaml
          git diff --check
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format stable MSC implementation"
          git push origin HEAD:fix/stable-profile-fields-rich-topic
