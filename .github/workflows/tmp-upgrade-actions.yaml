name: Temporary Actions runtime upgrade

on:
  push:
    branches:
      - fix/android-avif-web-ci

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upgrade first-party Actions to Node 24 releases
        shell: bash
        run: |
          grep -RIl --include='*.yml' --include='*.yaml' 'actions/checkout@v4\|actions/cache@v4' .github \
            | while IFS= read -r file; do
                sed -i \
                  -e 's#actions/checkout@v4#actions/checkout@v5#g' \
                  -e 's#actions/cache@v4#actions/cache@v5#g' \
                  "$file"
              done
      - name: Commit upgrades
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Actions runtime upgrades needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github
          git commit -m "ci: upgrade checkout and cache actions to v5"
          git push
