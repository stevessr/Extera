name: Update flutter_avif lockfile

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ github.event.pull_request.head.ref == 'fix/flutter-avif-own-fork' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
          pub-cache: false
      - name: Resolve and commit lockfile
        shell: bash
        run: |
          flutter pub get --no-example
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: update flutter_avif lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
