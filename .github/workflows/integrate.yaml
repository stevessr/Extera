name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build Android (APK)'
        type: boolean
        default: false
      web:
        description: 'Build web'
        type: boolean
        default: false
      linux:
        description: 'Build Linux'
        type: boolean
        default: false
      ios:
        description: 'Build iOS'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      web: ${{ steps.detect.outputs.web }}
      linux: ${{ steps.detect.outputs.linux }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      # The JS actions below declare runs.using: node24, which older runner
      # images do not ship. Must come before the first one of them.
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: ./scripts/ci/detect-changes.sh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FORCE_ALL: ${{ github.event_name == 'merge_group' }}
          MANUAL_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.android || 'false' }}
          MANUAL_WEB: ${{ github.event_name == 'workflow_dispatch' && inputs.web || 'false' }}
          MANUAL_LINUX: ${{ github.event_name == 'workflow_dispatch' && inputs.linux || 'false' }}
          MANUAL_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.ios || 'false' }}

  analyze:
    name: Analyze and test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Check locale config is up to date
        run: |
          ./scripts/generate-locale-config.sh
          git diff --exit-code

      - uses: ./.github/actions/setup-flutter

      - run: flutter gen-l10n

      - name: Check formatting
        run: dart format lib/ test/ --set-exit-if-changed

      - name: Check import ordering
        run: dart run import_sorter:main --no-comments --exit-if-changed

      - name: Check license compliance
        run: dart run license_checker check-licenses -c licenses.yaml --problematic

      - run: flutter analyze

      - name: Analyze with Google services enabled
        run: |
          git apply ./scripts/enable-android-google-services.patch
          flutter analyze

      - run: flutter test

  build-apk:
    name: Debug APK (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: armv7
            target_platform: android-arm
          - name: armv8
            target_platform: android-arm64
          - name: x86_64
            target_platform: android-x64
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-android-apk
        with:
          target-platform: ${{ matrix.target_platform }}
          flavor: fDebug
          mode: debug

  build-web:
    name: Debug web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      # Debug parity check for the release web bundle (target js).
      - uses: ./.github/actions/build-web-app
        with:
          target: js
          mode: debug

  build-linux:
    name: Debug Linux (x64)
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-linux-app
        with:
          arch: x64
          mode: debug

  # Opt-in: set the repository variable ENABLE_ARM64_RUNNER to "true" once a
  # self-hosted arm64 runner exists. Skipped otherwise, so a missing runner
  # never leaves a pull request waiting.
  build-linux-arm64:
    name: Debug Linux (arm64)
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' && vars.ENABLE_ARM64_RUNNER == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-linux-app
        with:
          arch: arm64
          mode: debug

  # Opt-in: set the repository variable ENABLE_MACOS_RUNNER to "true".
  build-ios:
    name: Debug iOS
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' && vars.ENABLE_MACOS_RUNNER == 'true' }}
    runs-on: macos-15
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          brew install node@24
          echo "$(brew --prefix node@24)/bin" >>"$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-flutter

      - name: Restore CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - run: brew install sqlcipher
      - run: flutter build ios --no-codesign

  ci:
    name: CI
    # `changes` is listed so that an infrastructure failure there cannot leave
    # every build skipped and still report green.
    needs: [changes, analyze, build-apk, build-web, build-linux, build-linux-arm64, build-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Report aggregate status
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "$JOBS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
