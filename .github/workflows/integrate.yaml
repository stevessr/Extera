name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Atlas analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter gen-l10n

      - name: Check formatting
        run: dart format lib/ test/ integration_test/ --set-exit-if-changed

      - name: Check atlas import ordering
        run: |
          dart run tidy_imports --no-comments --exit-if-changed \
            lib/utils/animated_emoji_atlas.dart \
            lib/widgets/animated_emoji_image.dart

      - name: Analyze atlas changes
        run: |
          flutter analyze lib/config/animated_emoji_config.dart
          flutter analyze lib/utils/animated_emoji_atlas.dart
          flutter analyze lib/widgets/animated_emoji_image.dart
          flutter analyze test/animated_emoji_atlas_config_test.dart
          flutter analyze test/animated_emoji_limit_test.dart

      - name: Test
        run: flutter test
