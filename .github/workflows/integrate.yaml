name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Atlas analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter gen-l10n

      - name: Check formatting
        run: dart format lib/ test/ integration_test/ --set-exit-if-changed

      - name: Normalize only atlas imports for validation
        run: |
          dart run tidy_imports --no-comments \
            lib/utils/animated_emoji_atlas.dart \
            lib/widgets/animated_emoji_image.dart
          git diff -- lib/utils/animated_emoji_atlas.dart lib/widgets/animated_emoji_image.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
