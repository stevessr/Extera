name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build Android (APK)'
        type: boolean
        default: false
      web:
        description: 'Build web'
        type: boolean
        default: false
      linux:
        description: 'Build Linux'
        type: boolean
        default: false
      ios:
        description: 'Build iOS'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

# actions/checkout@v5 and actions/cache@v5 use the runner-managed Node 24
# action runtime. Installing a system Node package does not upgrade that
# runtime; self-hosted runners must instead stay on Actions Runner >= 2.327.1.

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      web: ${{ steps.detect.outputs.web }}
      linux: ${{ steps.detect.outputs.linux }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: ./scripts/ci/detect-changes.sh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FORCE_ALL: ${{ github.event_name == 'merge_group' }}
          MANUAL_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.android || 'false' }}
          MANUAL_WEB: ${{ github.event_name == 'workflow_dispatch' && inputs.web || 'false' }}
          MANUAL_LINUX: ${{ github.event_name == 'workflow_dispatch' && inputs.linux || 'false' }}
          MANUAL_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.ios || 'false' }}

  analyze:
    name: Analyze and test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Check locale config is up to date
        run: |
          ./scripts/generate-locale-config.sh
          git diff --exit-code

      - uses: ./.github/actions/setup-flutter

      - name: Refresh dependency lockfile on this branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pubspec.lock
            git commit -m "build: refresh matrix sdk lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check dependency lockfile is up to date
        run: git diff --exit-code -- pubspec.lock

      - run: flutter gen-l10n

      - name: Apply pinned formatter to Emoji Kitchen files
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          dart format lib/pages/chat/emoji_kitchen_picker.dart lib/utils/emoji_kitchen.dart
          if ! git diff --quiet -- lib/pages/chat/emoji_kitchen_picker.dart lib/utils/emoji_kitchen.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/pages/chat/emoji_kitchen_picker.dart lib/utils/emoji_kitchen.dart
            git commit -m "style: format Emoji Kitchen implementation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check formatting
        run: dart format lib/ test/ integration_test/ --set-exit-if-changed

      - name: Check import ordering
        run: dart run tidy_imports --no-comments --exit-if-changed

      - name: Check license compliance
        run: dart run license_checker check-licenses -c licenses.yaml --problematic

      - run: flutter analyze

      - name: Analyze with Google services enabled
        run: |
          git apply ./scripts/enable-android-google-services.patch
          flutter analyze

      - run: flutter test

  build-apk:
    name: ${{ matrix.kind }} APK (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: armv7
            kind: Debug
            target_platform: android-arm
            flavor: fDebug
            mode: debug
            signing: 'false'
          - name: armv8
            kind: Release
            target_platform: android-arm64
            flavor: fRelease
            mode: release
            signing: 'true'
          - name: x86_64
            kind: Debug
            target_platform: android-x64
            flavor: fDebug
            mode: debug
            signing: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-android-apk
        with:
          target-platform: ${{ matrix.target_platform }}
          flavor: ${{ matrix.flavor }}
          mode: ${{ matrix.mode }}
          signing: ${{ matrix.signing }}

  build-web:
    name: Debug web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Debug parity check for the release web bundle (target js).
      - uses: ./.github/actions/build-web-app
        with:
          target: js
          mode: debug

  build-linux:
    name: Debug Linux (x64)
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-linux-app
        with:
          arch: x64
          mode: debug

  # Opt-in: set the repository variable ENABLE_ARM64_RUNNER to "true" once a
  # self-hosted arm64 runner running Actions Runner >= 2.327.1 exists. Skipped
  # otherwise, so a missing runner never leaves a pull request waiting.
  build-linux-arm64:
    name: Debug Linux (arm64)
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' && vars.ENABLE_ARM64_RUNNER == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-linux-app
        with:
          arch: arm64
          mode: debug

  # Opt-in: set the repository variable ENABLE_MACOS_RUNNER to "true". The
  # runner must support the Node 24 action runtime (Actions Runner >= 2.327.1).
  build-ios:
    name: Debug iOS
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' && vars.ENABLE_MACOS_RUNNER == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-flutter

      - name: Restore CocoaPods specs
        uses: actions/cache@v5
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - run: brew install sqlcipher
      - run: flutter build ios --no-codesign

  ci:
    name: CI
    # `changes` is listed so that an infrastructure failure there cannot leave
    # every build skipped and still report green.
    needs: [changes, analyze, build-apk, build-web, build-linux, build-linux-arm64, build-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report aggregate status
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "$JOBS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null