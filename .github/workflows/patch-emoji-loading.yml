name: Patch emoji loading reliability

on:
  push:
    branches:
      - fix/emoji-loading-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-loading-reliability
      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          picker = Path('lib/widgets/emoji_picker.dart')
          text = picker.read_text()
          old = '''  bool _isLoading = true;
  bool _initialLoadStarted = false;
  Animation<double>? _routeAnimation;

  @override
  void initState() {
    super.initState();
    _initTabs();
    WidgetsBinding.instance.addPostFrameCallback((_) {
      _loadAfterRouteTransition();
    });
  }

  void _loadAfterRouteTransition() {
    if (!mounted || _initialLoadStarted) return;

    final animation = ModalRoute.of(context)?.animation;
    if (animation == null || animation.status == AnimationStatus.completed) {
      _initialLoadStarted = true;
      _loadEmojis();
      return;
    }

    _routeAnimation?.removeStatusListener(_handleRouteAnimationStatus);
    _routeAnimation = animation;
    _routeAnimation?.addStatusListener(_handleRouteAnimationStatus);
  }

  void _handleRouteAnimationStatus(AnimationStatus status) {
    if (status != AnimationStatus.completed) return;

    _routeAnimation?.removeStatusListener(_handleRouteAnimationStatus);
    _routeAnimation = null;
    if (!mounted || _initialLoadStarted) return;

    _initialLoadStarted = true;
    _loadEmojis();
  }
'''
          new = '''  bool _isLoading = true;
  bool _initialLoadStarted = false;

  @override
  void initState() {
    super.initState();
    _initTabs();

    // The picker is embedded in the chat panel rather than presented as its
    // own route. Waiting for ModalRoute.animation to complete can therefore
    // miss the completion edge (or wait on an unrelated route transition),
    // leaving the grid on its loading spinner indefinitely. Build the cached
    // index after the first frame instead: this keeps the opening frame cheap
    // while making initialization deterministic.
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted || _initialLoadStarted) return;
      _initialLoadStarted = true;
      _loadEmojis();
    });
  }
'''
          if old not in text:
              raise SystemExit('emoji picker initialization block not found')
          text = text.replace(old, new, 1)
          old_dispose = '''  @override
  void dispose() {
    _routeAnimation?.removeStatusListener(_handleRouteAnimationStatus);
    _tabController.dispose();
    _searchController.dispose();
    super.dispose();
  }
'''
          new_dispose = '''  @override
  void dispose() {
    _tabController.dispose();
    _searchController.dispose();
    super.dispose();
  }
'''
          if old_dispose not in text:
              raise SystemExit('emoji picker dispose block not found')
          picker.write_text(text.replace(old_dispose, new_dispose, 1))

          mxc = Path('lib/widgets/mxc_image.dart')
          text = mxc.read_text()
          text = text.replace("import 'dart:io';\n", '', 1)
          needle = '''  Uint8List? _imageDataNoCache;

  Uint8List? get _imageData =>
'''
          replacement = '''  Uint8List? _imageDataNoCache;

  // Incremented whenever the image source changes. Async media requests keep
  // the generation they started with so stale completions cannot populate a
  // newer MxcImage with bytes from the previous grid cell.
  int _loadGeneration = 0;

  Uint8List? get _imageData =>
'''
          if needle not in text:
              raise SystemExit('MxcImage generation insertion point not found')
          text = text.replace(needle, replacement, 1)

          old_init = '''  @override
  void initState() {
    super.initState();
    WidgetsBinding.instance.addPostFrameCallback((_) => _tryLoad());
  }

  Future<void> _load() async {
'''
          new_init = '''  @override
  void initState() {
    super.initState();
    final generation = _loadGeneration;
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) _tryLoad(generation);
    });
  }

  @override
  void didUpdateWidget(MxcImage oldWidget) {
    super.didUpdateWidget(oldWidget);

    final sourceChanged =
        oldWidget.uri != widget.uri ||
        oldWidget.event != widget.event ||
        oldWidget.width != widget.width ||
        oldWidget.height != widget.height ||
        oldWidget.isThumbnail != widget.isThumbnail ||
        oldWidget.animated != widget.animated ||
        oldWidget.thumbnailMethod != widget.thumbnailMethod ||
        oldWidget.cacheKey != widget.cacheKey ||
        oldWidget.cacheName != widget.cacheName ||
        oldWidget.client != widget.client;
    if (!sourceChanged) return;

    _loadGeneration++;
    _imageDataNoCache = null;
    final generation = _loadGeneration;
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted && generation == _loadGeneration) {
        _tryLoad(generation);
      }
    });
  }

  Future<void> _load(int generation) async {
'''
          if old_init not in text:
              raise SystemExit('MxcImage init block not found')
          text = text.replace(old_init, new_init, 1)

          old_uri = '''      final remoteData = await client.downloadMxcCached(
        uri,
        width: realWidth,
        height: realHeight,
        thumbnailMethod: widget.thumbnailMethod,
        isThumbnail: widget.isThumbnail,
        animated: widget.animated,
      );
      if (!mounted) return;
      setState(() {
        _imageData = remoteData;
      });
'''
          new_uri = '''      final remoteData = await client.downloadMxcCached(
        uri,
        width: realWidth,
        height: realHeight,
        thumbnailMethod: widget.thumbnailMethod,
        isThumbnail: widget.isThumbnail,
        animated: widget.animated,
      );
      if (!mounted || generation != _loadGeneration) return;
      setState(() {
        _imageData = remoteData;
      });
'''
          if old_uri not in text:
              raise SystemExit('MxcImage uri completion block not found')
          text = text.replace(old_uri, new_uri, 1)

          old_event = '''      final data = await event.downloadAndDecryptAttachment(
        getThumbnail: useThumbnail,
      );
      if (data.detectFileType is MatrixImageFile) {
        if (!mounted) return;
        setState(() {
          _imageData = data.bytes;
        });
        return;
      }
'''
          new_event = '''      final data = await event.downloadAndDecryptAttachment(
        getThumbnail: useThumbnail,
      );
      if (generation != _loadGeneration) return;
      if (data.detectFileType is MatrixImageFile) {
        if (!mounted || generation != _loadGeneration) return;
        setState(() {
          _imageData = data.bytes;
        });
        return;
      }
'''
          if old_event not in text:
              raise SystemExit('MxcImage event completion block not found')
          text = text.replace(old_event, new_event, 1)

          old_retry = '''  Future<void> _tryLoad([int attempt = 0]) async {
    if (_imageData != null) {
      return;
    }
    try {
      await _load();
    } on IOException catch (_) {
      // Stop after a bounded number of attempts: retrying forever kept
      // burning network and CPU for permanently unavailable media.
      if (attempt >= _maxLoadAttempts) return;
      if (!mounted) return;
      await Future.delayed(widget.retryDuration);
      await _tryLoad(attempt + 1);
    }
  }
'''
          new_retry = '''  Future<void> _tryLoad(int generation, [int attempt = 0]) async {
    if (!mounted || generation != _loadGeneration || _imageData != null) {
      return;
    }
    try {
      await _load(generation);
    } catch (error, stackTrace) {
      // Media failures are not limited to dart:io IOException: HTTP status
      // errors, Matrix media errors and cache/database failures can all be
      // transient. Retry all load failures, but keep the existing hard bound.
      Logs().d(
        'Unable to load mxc image (attempt ${attempt + 1})',
        error,
        stackTrace,
      );
      if (attempt >= _maxLoadAttempts ||
          !mounted ||
          generation != _loadGeneration) {
        return;
      }
      await Future.delayed(widget.retryDuration);
      if (!mounted || generation != _loadGeneration) return;
      await _tryLoad(generation, attempt + 1);
    }
  }
'''
          if old_retry not in text:
              raise SystemExit('MxcImage retry block not found')
          mxc.write_text(text.replace(old_retry, new_retry, 1))

          chat_picker = Path('lib/pages/chat/chat_emoji_picker.dart')
          text = chat_picker.read_text()
          old_custom = '''                                return MxcImage(
                                  uri: Uri.parse(name),
                                  width: 32,
                                  height: 32,
                                  cacheKey: name,
                                  animated: true,
                                );
'''
          new_custom = '''                                return MxcImage(
                                  key: ValueKey(name),
                                  uri: Uri.parse(name),
                                  width: 32,
                                  height: 32,
                                  cacheKey: name,
                                  animated: true,
                                  retryDuration: const Duration(
                                    milliseconds: 500,
                                  ),
                                );
'''
          if old_custom not in text:
              raise SystemExit('custom emoji MxcImage block not found')
          text = text.replace(old_custom, new_custom, 1)
          old_icon = '''                  icon: MxcImage(
                    uri: entry.value.images.values.first.url,
                    width: 32,
                    height: 32,
                    cacheKey: entry.value.images.values.first.url.toString(),
                  ),
'''
          new_icon = '''                  icon: MxcImage(
                    uri: entry.value.images.values.first.url,
                    width: 32,
                    height: 32,
                    cacheKey: entry.value.images.values.first.url.toString(),
                    retryDuration: const Duration(milliseconds: 500),
                  ),
'''
          if old_icon not in text:
              raise SystemExit('custom category icon MxcImage block not found')
          chat_picker.write_text(text.replace(old_icon, new_icon, 1))
          PY
          dart format lib/widgets/emoji_picker.dart lib/widgets/mxc_image.dart lib/pages/chat/chat_emoji_picker.dart
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/emoji_picker.dart lib/widgets/mxc_image.dart lib/pages/chat/chat_emoji_picker.dart
          git commit -m 'fix: make emoji loading reliable'
          git push origin HEAD:fix/emoji-loading-reliability
