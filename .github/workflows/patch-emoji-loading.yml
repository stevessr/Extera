name: Patch emoji loading reliability

on:
  push:
    branches:
      - fix/emoji-loading-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-loading-reliability
      - name: Apply patch
        run: python3 scripts/ci/patch_emoji_loading.py
      - name: Format changed Dart files
        run: dart format lib/widgets/emoji_picker.dart lib/widgets/mxc_image.dart lib/pages/chat/chat_emoji_picker.dart
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/emoji_picker.dart lib/widgets/mxc_image.dart lib/pages/chat/chat_emoji_picker.dart
          git commit -m 'fix: make emoji loading reliable'
          git push origin HEAD:fix/emoji-loading-reliability
