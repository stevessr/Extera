name: Temp format poll

on:
  push:
    branches:
      - fix/latex-multiline-complex-rendering

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/latex-multiline-complex-rendering
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - name: Apply Dart formatter
        run: |
          dart format lib/pages/chat/events/poll_content.dart
          if git diff --quiet -- lib/pages/chat/events/poll_content.dart; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/pages/chat/events/poll_content.dart
          git commit -m "style: format poll content"
          git push origin HEAD:fix/latex-multiline-complex-rendering
