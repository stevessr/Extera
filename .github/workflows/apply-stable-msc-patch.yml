name: Verify stable MSC SDK tests

on:
  push:
    branches:
      - feat/stable-msc-image-packs-recents
    paths:
      - .github/workflows/apply-stable-msc-patch.yml

permissions:
  contents: read

jobs:
  verify-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter
        with:
          pub-get: 'false'

      - name: Checkout Matrix SDK Extera branch
        run: |
          git clone --depth 1 --branch Extera \
            https://github.com/stevessr/matrix-dart-sdk.git \
            /tmp/matrix-dart-sdk
          test "$(git -C /tmp/matrix-dart-sdk rev-parse HEAD)" = \
            "30a3f6f2ec6ec45832475af57ed69b971ba15588"

      - name: Resolve SDK dev dependencies
        working-directory: /tmp/matrix-dart-sdk
        run: dart pub get --no-example

      - name: Check changed SDK formatting
        working-directory: /tmp/matrix-dart-sdk
        run: |
          dart format --set-exit-if-changed \
            lib/matrix_api_lite/model/event_types.dart \
            lib/msc_extensions/extension_recent_emoji/recent_emoji.dart \
            lib/src/utils/image_pack_extension.dart \
            test/stable_image_pack_test.dart \
            test/stable_recent_emoji_test.dart

      - name: Analyze SDK
        working-directory: /tmp/matrix-dart-sdk
        run: dart analyze

      - name: Run stable MSC protocol tests
        working-directory: /tmp/matrix-dart-sdk
        run: |
          dart test \
            test/stable_recent_emoji_test.dart \
            test/stable_image_pack_test.dart
