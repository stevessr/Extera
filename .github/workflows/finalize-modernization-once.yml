name: Finalize analyzer modernization once

on:
  push:
    branches:
      - fix/android-avif-web-ci
    paths:
      - .github/workflows/finalize-modernization-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-avif-web-ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          channel: stable
          cache: true

      - name: Reuse validated migration script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/modernize-analyzer-once.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          start = source.index(begin) + len(begin)
          stop = source.index(end, start)
          body = source[start:stop]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/modernize.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/modernize.py

      - name: Refresh Matrix SDK lock and dependencies
        run: |
          flutter pub upgrade matrix --no-example
          flutter pub get --no-example

      - name: Normalize sources
        run: |
          dart format lib test integration_test tool
          dart run tidy_imports --no-comments
          dart format lib test integration_test tool
          dart run tidy_imports --no-comments --exit-if-changed

      - name: Verify analyzer is clean
        run: flutter analyze

      - name: Verify licenses
        run: dart run license_checker check-licenses -c licenses.yaml --problematic

      - name: Commit modernization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock lib test integration_test tool
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: modernize Dart APIs for Flutter 3.47"
          git push origin HEAD:fix/android-avif-web-ci
