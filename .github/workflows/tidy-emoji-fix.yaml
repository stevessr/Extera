name: Tidy emoji fix branch

on:
  push:
    branches:
      - fix/emoji-picker-stuck-loading
    paths:
      - .github/workflows/tidy-emoji-fix.yaml

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-picker-stuck-loading
      - uses: ./.github/actions/setup-flutter
      - name: Sort imports
        run: dart run tidy_imports --no-comments
      - name: Commit sorted imports
        run: |
          if git diff --quiet -- lib/; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/
          git commit -m "style: sort dart imports"
          git push origin HEAD:fix/emoji-picker-stuck-loading
