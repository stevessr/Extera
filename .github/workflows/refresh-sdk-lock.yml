name: Refresh SDK lockfile

on:
  push:
    branches:
      - chore/matrix-sdk-v11

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/matrix-sdk-v11
      - uses: ./.github/actions/setup-flutter
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo 'pubspec.lock is already current'
            exit 0
          fi
          git commit -m 'chore: refresh Matrix SDK revision'
          git push origin HEAD:chore/matrix-sdk-v11
