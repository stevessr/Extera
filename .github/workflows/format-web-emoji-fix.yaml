name: Format web emoji fix

on:
  push:
    branches:
      - fix/web-emoji-generic-list-crash

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/web-emoji-generic-list-crash
      - uses: ./.github/actions/setup-flutter
      - name: Format changed Dart sources
        run: dart format lib/config/emoji_data.dart lib/utils/emoji_picker_recent.dart lib/widgets/emoji_picker.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- lib/config/emoji_data.dart lib/utils/emoji_picker_recent.dart lib/widgets/emoji_picker.dart; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/config/emoji_data.dart lib/utils/emoji_picker_recent.dart lib/widgets/emoji_picker.dart
          git commit -m "style: format web emoji fix with package config"
          git push origin HEAD:fix/web-emoji-generic-list-crash
