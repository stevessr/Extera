name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'  # excludes prereleases handled below
      - 'v*.*.*-*'    # prereleases (e.g. v1.2.3-beta)

# Triggering on every tag starting with `v` works because we filter
# release vs prerelease inside the workflow based on the tag name.

concurrency:
  group: release_workflow-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Figure out whether this is a stable release or a prerelease.
  # Exposes `is_prerelease` and `release_name` for downstream jobs.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A tag containing a dash after the version number is a prerelease
          # (e.g. v1.2.3-beta, v1.2.3-rc1).
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------------
  build_apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: cat .github/workflows/versions.env >> "$GITHUB_ENV"
      - uses: https://github.com/actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "Secret KEYSTORE_FILE is not set — cannot sign release APK." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > android/key.jks
          echo "Keystore decoded: $(ls -l android/key.jks)"
      - name: Write key.properties
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "Secrets KEYSTORE_PASS and KEY_PASS must be set." >&2
            exit 1
          fi
          # KEY_ALIAS defaults to "key" if the secret is not configured.
          alias="${KEY_ALIAS:-key}"
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASS}
          keyPassword=${KEY_PASS}
          keyAlias=${alias}
          storeFile=key.jks
          EOF
          ls -l android/key.properties
      - name: Build signed release APK
        run: flutter build apk --release
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/ExteraNext-${{ needs.prepare.outputs.tag }}-android.apk
      - name: Verify APK signature
        run: |
          # Print signer certs so you can confirm it was signed with your key.
          APKSIGNER="$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skipping verification"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs artifacts/*.apk || true
      - uses: https://github.com/actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux AppImage (x86_64)
  # ---------------------------------------------------------------------------
  build_appimage:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: cat .github/workflows/versions.env >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev \
            cmake-data libsecret-1-dev libsecret-1-0 librhash0 \
            libssl-dev libwebkit2gtk-4.1-dev
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Install appimagetool
        run: |
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        run: ./scripts/build-appimage.sh
      - name: Rename AppImage
        run: |
          mkdir -p artifacts
          # appimagetool outputs Extera_Next-x86_64.AppImage in the appimage dir
          if [ -f appimage/Extera_Next-x86_64.AppImage ]; then
            cp appimage/Extera_Next-x86_64.AppImage \
              artifacts/ExteraNext-${{ needs.prepare.outputs.tag }}-x86_64.AppImage
          else
            # fall back to whatever AppImage was produced
            cp appimage/*.AppImage \
              artifacts/ExteraNext-${{ needs.prepare.outputs.tag }}-x86_64.AppImage
          fi
      - uses: https://github.com/actions/upload-artifact@v4
        with:
          name: appimage
          path: artifacts/*.AppImage
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Web build (tar.gz)
  # ---------------------------------------------------------------------------
  build_web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: cat .github/workflows/versions.env >> "$GITHUB_ENV"
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install cargo utilities
        run: |
          # prepare-web.sh installs flutter_rust_bridge_codegen via cargo,
          # so cargo must be available (rust-toolchain installs cargo).
          cargo --version
      - name: Install yq
        run: |
          sudo wget -q -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - run: flutter build web --release
      - name: Package web bundle
        run: |
          mkdir -p artifacts
          tar -czvf "artifacts/ExteraNext-${{ needs.prepare.outputs.tag }}-web.tar.gz" \
            -C build/web .
      - uses: https://github.com/actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/*.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux tarball (x64 release bundle)
  # ---------------------------------------------------------------------------
  build_linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: cat .github/workflows/versions.env >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev \
            cmake-data libsecret-1-dev libsecret-1-0 librhash0 \
            libssl-dev libwebkit2gtk-4.1-dev
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: Package Linux bundle
        run: ./scripts/build-linux.sh
      - name: Rename tarball
        run: |
          mkdir -p artifacts
          cp build/linux/x64/release/bundle.tar.gz \
            artifacts/ExteraNext-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz
      - uses: https://github.com/actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish all artifacts to the Forgejo release.
  # Uses the Gitea/Forgejo release API (compatible token: GITHUB_TOKEN).
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, build_apk, build_appimage, build_linux, build_web]
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.apk' -o \
            -name '*.AppImage' -o \
            -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -lR release-assets
      - name: Create / update release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail

          # Check if release already exists for this tag.
          http_code=$(curl -s -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/json" \
            "$API/repos/$REPO/releases/tags/$TAG")

          if [ "$http_code" = "200" ]; then
            release_id=$(jq -r '.id' /tmp/release.json)
            echo "Release #$release_id already exists, uploading assets to it."
          else
            body=$(jq -n --arg name "$TAG" --arg tag "$TAG" --argjson pre "$IS_PRERELEASE" \
              '{
                tag_name: $tag,
                name: $name,
                body: ("ExteraNext " + $name),
                draft: false,
                prerelease: $pre,
                make_latest: "true"
              }')
            curl -s -o /tmp/release.json -w '%{http_code}\n' \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$API/repos/$REPO/releases"
            release_id=$(jq -r '.id' /tmp/release.json)
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "Failed to create release:" >&2
              cat /tmp/release.json >&2
              exit 1
            fi
            echo "Created release #$release_id"
          fi

          # Upload every asset to the release.
          for asset in release-assets/*; do
            name=$(basename "$asset")
            echo "Uploading $name ..."
            # Delete an existing asset with the same name (allows re-runs).
            existing=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "$API/repos/$REPO/releases/$release_id/assets" \
              | jq -r --arg name "$name" \
                '.[] | select(.name == $name) | .id' 2>/dev/null || true)
            for aid in $existing; do
              [ -n "$aid" ] && \
                curl -s -X DELETE \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  "$API/repos/$REPO/releases/assets/$aid" || true
            done
            # Upload the new asset.
            upload_url="$API/repos/$REPO/releases/$release_id/assets?name=$name"
            curl -sSf -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$asset" \
              "$upload_url"
          done

          echo "Release published."