name: Release

on:
  push:
    tags:
      # Also covers prerelease tags such as v1.2.3-rc1.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to name the artifacts and release after (e.g. v0.0.0-test)'
        required: true
        default: 'v0.0.0-test'
      publish:
        description: 'Create the Forgejo release instead of only uploading artifacts'
        type: boolean
        default: false
      draft:
        description: 'Leave the release as a draft'
        type: boolean
        default: false
      android:
        description: 'Build Android APK'
        type: boolean
        default: false
      android_arch:
        description: 'Android ABI set to build'
        type: choice
        default: 'armv8'
        options:
          - 'armv8'
          - 'armv7 & armv8'
          - 'arm & x86_64'
      web:
        description: 'Build web bundle'
        type: boolean
        default: false
      web_target:
        description: 'Web compiler target (wasm ships a JS fallback and COOP/COEP headers)'
        type: choice
        default: 'js'
        options:
          - 'js'
          - 'wasm'
      linux:
        description: 'Build Linux tarball and AppImage'
        type: boolean
        default: false
      linux_arch:
        description: 'Linux architecture(s) to build'
        type: choice
        default: 'amd64'
        options:
          - 'amd64'
          - 'arm64'
          - 'amd64 & arm64'
      apple:
        description: 'Build Apple targets'
        type: boolean
        default: false
      apple_target:
        description: 'Apple target(s) to build'
        type: choice
        default: 'ios & macos'
        options:
          - 'ios'
          - 'macos'
          - 'ios & macos'

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.matrices.outputs.matrix }}
      any: ${{ steps.matrices.outputs.any }}
    steps:
      # The JS actions below declare runs.using: node24, which older runner
      # images do not ship. Must come before the first one of them.
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      - id: meta
        run: ./scripts/ci/resolve-release-meta.sh
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      # Emit one build-matrix covering every requested platform, so all builds
      # fan out from a single job. Tag pushes carry no inputs and always get
      # the full spread: every Android ABI, amd64 Linux, JS web, iOS and macOS.
      - id: matrices
        env:
          EVENT: ${{ github.event_name }}
          ANDROID_ENABLED: ${{ inputs.android }}
          ANDROID_ARCH_INPUT: ${{ inputs.android_arch }}
          LINUX_ENABLED: ${{ inputs.linux }}
          LINUX_ARCH_INPUT: ${{ inputs.linux_arch }}
          WEB_ENABLED: ${{ inputs.web }}
          WEB_TARGET_INPUT: ${{ inputs.web_target }}
          APPLE_ENABLED: ${{ inputs.apple }}
          APPLE_TARGET_INPUT: ${{ inputs.apple_target }}
          ARM64_RUNNER: ${{ vars.ENABLE_ARM64_RUNNER }}
        run: |
          if [ "$EVENT" = push ]; then
            ANDROID_ENABLED=true LINUX_ENABLED=true WEB_ENABLED=true APPLE_ENABLED=true
            ANDROID_ARCH=full LINUX_ARCH=amd64 WEB_TARGET=js APPLE_TARGET='ios & macos'
          else
            ANDROID_ARCH=$ANDROID_ARCH_INPUT
            LINUX_ARCH=$LINUX_ARCH_INPUT
            APPLE_TARGET=$APPLE_TARGET_INPUT
            case "$WEB_TARGET_INPUT" in js|wasm) WEB_TARGET=$WEB_TARGET_INPUT ;; *) WEB_TARGET=js ;; esac
          fi

          entries=()

          if [ "$ANDROID_ENABLED" = true ]; then
            abi_entry() { # <label> <target_platform>
              entries+=("{\"name\":\"$1\",\"platform\":\"apk\",\"target_platform\":\"$2\",\"runner\":\"ubuntu-latest\"}")
            }
            # "arm" in the presets is the 32-bit ABI published as android-armv7.
            case "$ANDROID_ARCH" in
              full)
                abi_entry armv7 android-arm
                abi_entry armv8 android-arm64
                abi_entry x86_64 android-x64
                ;;
              'armv7 & armv8')
                abi_entry armv7 android-arm
                abi_entry armv8 android-arm64
                ;;
              'arm & x86_64')
                abi_entry armv7 android-arm
                abi_entry x86_64 android-x64
                ;;
              *)
                abi_entry armv8 android-arm64
                ;;
            esac
          fi

          if [ "$LINUX_ENABLED" = true ]; then
            case "$LINUX_ARCH" in
              'amd64 & arm64')
                entries+=('{"name":"linux-x64","platform":"linux","arch":"x64","runner":"ubuntu-latest"}')
                if [ "$ARM64_RUNNER" = true ]; then
                  entries+=('{"name":"linux-arm64","platform":"linux","arch":"arm64","runner":"self-hosted"}')
                fi
                ;;
              arm64)
                if [ "$ARM64_RUNNER" = true ]; then
                  entries+=('{"name":"linux-arm64","platform":"linux","arch":"arm64","runner":"self-hosted"}')
                fi
                ;;
              *)
                entries+=('{"name":"linux-x64","platform":"linux","arch":"x64","runner":"ubuntu-latest"}')
                ;;
            esac
          fi

          if [ "$WEB_ENABLED" = true ]; then
            artifact=web
            [ "$WEB_TARGET" != js ] && artifact="web-$WEB_TARGET"
            entries+=("{\"name\":\"$artifact\",\"platform\":\"web\",\"web_target\":\"$WEB_TARGET\",\"runner\":\"ubuntu-latest\"}")
          fi

          if [ "$APPLE_ENABLED" = true ]; then
            case "$APPLE_TARGET" in
              ios)
                entries+=('{"name":"ios","platform":"ios","runner":"macos-15"}')
                ;;
              macos)
                entries+=('{"name":"macos","platform":"macos","runner":"macos-15"}')
                ;;
              *)
                entries+=('{"name":"ios","platform":"ios","runner":"macos-15"}')
                entries+=('{"name":"macos","platform":"macos","runner":"macos-15"}')
                ;;
            esac
          fi

          {
            echo "matrix=$(IFS=,; printf '[%s]' "${entries[*]}")"
            echo "any=$([ "${#entries[@]}" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"

  # Every platform build is a matrix entry of this one job so they all start
  # together under a single concurrency budget.
  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ (github.event_name == 'push' || inputs.android || inputs.linux || inputs.web || inputs.apple) && needs.prepare.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Ensure Node 24 (Linux)
        if: ${{ runner.os != 'macOS' }}
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - name: Ensure Node 24 (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          brew install node@24
          echo "$(brew --prefix node@24)/bin" >>"$GITHUB_PATH"

      - uses: actions/checkout@v4

      - id: provenance
        name: Resolve artifact provenance
        run: |
          echo "build_date=$(date -u +%Y%m%d)" >>"$GITHUB_OUTPUT"
          echo "commit_hash=$(git rev-parse --short=8 HEAD)" >>"$GITHUB_OUTPUT"

      # --- Android APK ---
      - uses: ./.github/actions/build-android-apk
        if: ${{ matrix.platform == 'apk' }}
        with:
          target-platform: ${{ matrix.target_platform }}
          signing: 'true'
          keystore-file: ${{ secrets.KEYSTORE_FILE }}
          keystore-pass: ${{ secrets.KEYSTORE_PASS }}
          key-pass: ${{ secrets.KEY_PASS }}
          key-alias: ${{ secrets.KEY_ALIAS }}

      - run: ./scripts/ci/package-artifacts.sh apk "${{ needs.prepare.outputs.tag }}" "${{ matrix.name }}"
        if: ${{ matrix.platform == 'apk' }}
        env:
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}
      - run: ./scripts/ci/verify-apk-signature.sh artifacts/*.apk
        if: ${{ matrix.platform == 'apk' }}

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'apk' }}
        with:
          name: apk-${{ matrix.name }}-${{ steps.provenance.outputs.build_date }}-${{ steps.provenance.outputs.commit_hash }}
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error

      # --- Linux tarball and AppImage ---
      - uses: ./.github/actions/build-linux-app
        if: ${{ matrix.platform == 'linux' }}
        with:
          arch: ${{ matrix.arch }}
          appimage: 'true'

      - name: Package tarball
        if: ${{ matrix.platform == 'linux' }}
        run: ./scripts/ci/package-artifacts.sh linux "${{ needs.prepare.outputs.tag }}" "${{ matrix.arch }}"
        env:
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}

      - name: Package AppImage
        if: ${{ matrix.platform == 'linux' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}
        run: ./scripts/ci/package-artifacts.sh appimage "${{ needs.prepare.outputs.tag }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'linux' }}
        with:
          name: ${{ matrix.name }}-${{ steps.provenance.outputs.build_date }}-${{ steps.provenance.outputs.commit_hash }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.AppImage
          retention-days: 14
          if-no-files-found: error

      # --- Web bundle ---
      - uses: ./.github/actions/build-web-app
        if: ${{ matrix.platform == 'web' }}
        with:
          target: ${{ matrix.web_target }}
          base-href: '/web/'

      - run: ./scripts/ci/package-artifacts.sh web "${{ needs.prepare.outputs.tag }}" "${{ matrix.web_target }}"
        if: ${{ matrix.platform == 'web' }}
        env:
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'web' }}
        with:
          name: ${{ matrix.name }}-${{ steps.provenance.outputs.build_date }}-${{ steps.provenance.outputs.commit_hash }}
          path: artifacts/*.tar.gz
          retention-days: 14
          if-no-files-found: error

      # --- Apple targets ---
      - name: Select Xcode
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-flutter
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}

      - name: Restore CocoaPods specs
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'macos/Podfile.lock') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Install Apple native dependencies
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        run: brew install sqlcipher

      - name: Build unsigned iOS
        if: ${{ matrix.platform == 'ios' }}
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: ${{ matrix.platform == 'ios' }}
        run: ./scripts/ci/package-artifacts.sh ios "${{ needs.prepare.outputs.tag }}"
        env:
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'ios' }}
        with:
          name: ios-unsigned-${{ steps.provenance.outputs.build_date }}-${{ steps.provenance.outputs.commit_hash }}
          path: artifacts/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Build macOS
        if: ${{ matrix.platform == 'macos' }}
        run: flutter build macos --release

      - name: Package macOS app
        if: ${{ matrix.platform == 'macos' }}
        run: ./scripts/ci/package-artifacts.sh macos "${{ needs.prepare.outputs.tag }}"
        env:
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
          COMMIT_HASH: ${{ steps.provenance.outputs.commit_hash }}

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'macos' }}
        with:
          name: macos-${{ steps.provenance.outputs.build_date }}-${{ steps.provenance.outputs.commit_hash }}
          path: artifacts/*.zip
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ always() && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Collect release assets
        run: ./scripts/ci/collect-release-assets.sh downloads release-assets

      - name: Generate release notes
        run: ./scripts/ci/release-notes.sh "${{ needs.prepare.outputs.version }}" release-notes.md

      - name: Create release and upload assets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          KEEP_DRAFT: ${{ inputs.draft || 'false' }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: ./scripts/ci/publish-release.sh
