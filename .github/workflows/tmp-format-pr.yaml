name: Temporary project-aware formatter

on:
  push:
    branches:
      - fix/android-avif-web-ci

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - name: Format remaining project-aware sources
        run: |
          dart format \
            lib/pages/dialer/livekit_call_screen.dart \
            lib/pages/settings_custom_experience/settings_custom_experience_view.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/pages/dialer/livekit_call_screen.dart \
            lib/pages/settings_custom_experience/settings_custom_experience_view.dart
          git commit -m "style: apply project-aware Dart formatting"
          git push
