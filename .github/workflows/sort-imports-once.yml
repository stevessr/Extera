name: Normalize Dart imports once

on:
  push:
    branches:
      - fix/android-avif-web-ci
    paths:
      - .github/workflows/sort-imports-once.yml

permissions:
  contents: write

jobs:
  sort-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-avif-web-ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --no-example

      - name: Normalize source and test imports
        run: |
          dart run tidy_imports --no-comments
          dart format lib test integration_test

      - name: Verify sorter and formatter are idempotent
        run: |
          dart format lib test integration_test --set-exit-if-changed
          dart run tidy_imports --no-comments --exit-if-changed

      - name: Commit normalized Dart files
        run: |
          if git diff --quiet -- lib test integration_test; then
            echo "Dart imports are already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: normalize Dart import ordering"
          git push origin HEAD:fix/android-avif-web-ci
