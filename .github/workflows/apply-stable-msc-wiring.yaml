name: Apply stable MSC source wiring

on:
  push:
    branches:
      - fix/stable-profile-fields-rich-topic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stable-profile-fields-rich-topic
      - name: Apply source patch
        run: python3 tool/apply_stable_msc_wiring.py
      - name: Commit source patch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: wire stable profile fields and rich topics"
          git push origin HEAD:fix/stable-profile-fields-rich-topic
