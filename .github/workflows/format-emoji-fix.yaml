name: Format emoji fix branch

on:
  push:
    branches:
      - fix/emoji-picker-stuck-loading
    paths:
      - .github/workflows/format-emoji-fix.yaml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-picker-stuck-loading
      - uses: ./.github/actions/setup-flutter
      - name: Format Dart sources
        run: dart format lib/ test/ integration_test/
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ test/ integration_test/
          git commit -m "style: format dart sources"
          git push origin HEAD:fix/emoji-picker-stuck-loading
