name: Update lockfile and Google patch once

on:
  push:
    branches:
      - fix/android-avif-web-ci
    paths:
      - .github/workflows/update-lock-and-google-patch-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-avif-web-ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          channel: stable
          cache: true
          pub-cache: false

      - name: Update lockfile and current Google marker API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/utils/background_push.dart')
          text = path.read_text()
          old = '//<GOOGLE_SERVICES>    activeclients: clients,'
          new = '//<GOOGLE_SERVICES>    activeClient: clients.firstOrNull,'
          if old not in text:
              raise SystemExit('stale activeclients marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -rf .dart_tool
          flutter pub upgrade --no-example
          dart format lib/utils/background_push.dart --set-exit-if-changed
          flutter analyze
          git diff --check
          git add lib/utils/background_push.dart pubspec.lock

      - name: Regenerate Google services patch from current tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          old = '  #fcm_shared_isolate: ^0.2.0\n'
          new = '  fcm_shared_isolate: ^0.2.0\n'
          if old not in text:
              raise SystemExit('FCM dependency marker not found')
          pubspec.write_text(text.replace(old, new, 1))

          background = Path('lib/utils/background_push.dart')
          text = background.read_text()
          marker = '//<GOOGLE_SERVICES>'
          count = text.count(marker)
          if count == 0:
              raise SystemExit('Google services source markers not found')
          background.write_text(text.replace(marker, ''))
          print(f'Enabled {count} Google services source markers')
          PY
          git diff -- lib/utils/background_push.dart pubspec.yaml > scripts/enable-android-google-services.patch
          sed -i 's/[[:space:]]\+$//' scripts/enable-android-google-services.patch
          git restore --worktree lib/utils/background_push.dart pubspec.yaml
          git apply --check scripts/enable-android-google-services.patch
          git add scripts/enable-android-google-services.patch

      - name: Validate Google services configuration
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/enable-android-google-services.patch
          rm -rf .dart_tool
          flutter pub get --no-example
          flutter analyze
          git restore --worktree lib/utils/background_push.dart pubspec.yaml pubspec.lock

      - name: Commit verified updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: refresh dependency lockfile and Google services check"
          git push origin HEAD:fix/android-avif-web-ci
