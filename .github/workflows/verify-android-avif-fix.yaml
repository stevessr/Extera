name: Verify Android AVIF fix

on:
  push:
    paths:
      - '.github/workflows/verify-android-avif-fix.yaml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  armv8:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Node 24
        run: |
          node -p process.versions.node 2>/dev/null | grep -qE '^(2[4-9]|[3-9][0-9])\.' && exit 0 || true
          command -v sudo >/dev/null && sudo=sudo || sudo=
          curl -fsSL https://deb.nodesource.com/setup_24.x | $sudo bash -
          $sudo apt-get install -y nodejs

      - uses: actions/checkout@v4

      # Exercise the exact arm64 APK path that failed in Release #32.
      - uses: ./.github/actions/build-android-apk
        with:
          target-platform: android-arm64
          signing: 'true'
