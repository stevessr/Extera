name: Temporary format emoji sticker audit

on:
  push:
    branches:
      - fix/emoji-picker-sticker-reload-regression

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/emoji-picker-sticker-reload-regression
      - uses: ./.github/actions/setup-flutter
      - name: Format files detected by CI
        run: |
          dart format \
            lib/pages/settings_emotes/settings_emotes_view.dart \
            lib/utils/image_pack_migration.dart \
            lib/utils/client_download_content_extension.dart \
            lib/pages/chat/chat_emoji_picker.dart \
            lib/pages/chat/sticker_picker_dialog.dart \
            lib/widgets/emoji_picker.dart \
            lib/widgets/mxc_image.dart
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-format-emoji-sticker-audit.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/settings_emotes/settings_emotes_view.dart \
            lib/utils/image_pack_migration.dart \
            lib/utils/client_download_content_extension.dart \
            lib/pages/chat/chat_emoji_picker.dart \
            lib/pages/chat/sticker_picker_dialog.dart \
            lib/widgets/emoji_picker.dart \
            lib/widgets/mxc_image.dart \
            .github/workflows/temporary-format-emoji-sticker-audit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format image pack and picker changes'
          git push origin HEAD:fix/emoji-picker-sticker-reload-regression
