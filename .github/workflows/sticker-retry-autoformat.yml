name: Temporary sticker retry autoformat
on:
  push:
    branches: [fix/sticker-retry-preserve-event-type]
    paths:
      - '.github/workflows/sticker-retry-autoformat.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/sticker-retry-preserve-event-type
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - name: Apply Dart format and commit
        run: |
          set -euo pipefail
          dart format lib/pages/chat/events/gallery_content.dart test/retry_failed_event_test.dart
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/pages/chat/events/gallery_content.dart test/retry_failed_event_test.dart
            git commit -m "style: apply Dart formatter to sticker retry tests and gallery"
            git push origin HEAD:fix/sticker-retry-preserve-event-type
          fi
