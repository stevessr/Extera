name: Build web app
description: >
  Prepares the web dependencies and builds the Flutter web bundle with dart2js
  (target js) or dart2wasm plus a JS fallback (target wasm).

inputs:
  target:
    description: Compiler target, js or wasm.
    required: false
    default: js
  mode:
    description: Build mode (release or debug).
    required: false
    default: release
  base-href:
    description: >
      Value for --base-href in release builds (e.g. /web/). Leave empty when
      the bundle is served from the site root.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-flutter
    # The vodozemac wasm crate is compiled inside a directory prepare-web.sh
    # deletes, so redirect and cache CARGO_TARGET_DIR for it.
    - uses: ./.github/actions/setup-rust
      with:
        cache-target-dir: 'true'

    - name: Restore nightly rustup toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/update-hashes
        key: rustup-nightly-${{ runner.os }}-${{ runner.arch }}

    # rust-src on nightly is what flutter_rust_bridge needs to build the wasm
    # bindings. Installing the toolchain by name avoids naming a host triple,
    # and works whether or not nightly is already present.
    - run: rustup toolchain install nightly --component rust-src
      shell: bash

    - name: Restore yq binary
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/yq
        key: yq-${{ runner.os }}-${{ runner.arch }}-${{ env.YQ_VERSION }}

    - name: Install yq
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        YQ_INSTALL_DIR="$HOME/.local/bin" ./scripts/ci/install-yq.sh
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"

    - name: Prepare web
      shell: bash
      run: ./scripts/prepare-web.sh

    - name: Build web
      shell: bash
      env:
        WEB_TARGET: ${{ inputs.target }}
        BUILD_MODE: ${{ inputs.mode }}
        BASE_HREF: ${{ inputs.base-href }}
      run: |
        args=''
        if [ "$BUILD_MODE" = release ]; then
          args='--no-web-resources-cdn --release --source-maps'
          if [ -n "$BASE_HREF" ]; then
            args="$args --base-href $BASE_HREF"
          fi
        fi
        if [ "$WEB_TARGET" = wasm ]; then
          args="$args --wasm"
        elif [ "$WEB_TARGET" != js ]; then
          echo "Unsupported web target: $WEB_TARGET" >&2
          exit 1
        fi
        flutter build web $args

    # KaTeX fonts load lazily at first LaTeX render; drop them from the
    # startup font manifest (scripts/strip-katex-manifest.py).
    - name: Strip KaTeX fonts from startup manifest
      if: ${{ inputs.mode == 'release' }}
      shell: bash
      run: python3 scripts/strip-katex-manifest.py build/web/assets/FontManifest.json
    # The matrix SDK native-implementations web worker is a pure Dart entry
    # point compiled to JS; it serves image shrinking and metadata
    # calculation off the main thread for both the js and wasm bundles.
    - name: Compile native implementations web worker
      shell: bash
      run: |
        dart compile js --minify -O4 \
          -o build/web/native_impl_worker.dart.js web/native_impl_worker.dart

    # dart2wasm requires cross-origin isolation; ship COOP/COEP headers with
    # the bundle so hosts that honour them (Cloudflare Workers/Pages) serve it
    # correctly. Cache tiers follow URL stability: everything that changes
    # every build (entrypoints, manifests, the bootstrap that embeds build
    # hashes) must revalidate - a 304 keeps bytes off the wire without ever
    # risking stale bundles; long-lived static assets get TTLs. The vodozemac
    # bindings are pinned-dependency output whose bytes must never go stale
    # against newer Dart code (runtime wire mismatch), so they revalidate
    # too. Rules are last-match-wins, so specific paths come after broader
    # ones.
    - name: Add COOP/COEP and cache-control headers
      if: ${{ inputs.target == 'wasm' }}
      shell: bash
      run: |
        cat >build/web/_headers <<'EOF'
        /*
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: require-corp

        /index.html
          Cache-Control: no-cache

        /auth.html
          Cache-Control: no-cache

        /config.json
          Cache-Control: no-cache

        /flutter.js
          Cache-Control: no-cache

        /flutter_bootstrap.js
          Cache-Control: no-cache

        /flutter_service_worker.js
          Cache-Control: no-cache

        /main.dart.*
          Cache-Control: no-cache

        /native_impl_worker.dart.js
          Cache-Control: no-cache

        /assets/AssetManifest.bin
          Cache-Control: no-cache

        /assets/AssetManifest.bin.json
          Cache-Control: no-cache

        /assets/FontManifest.json
          Cache-Control: no-cache

        /assets/NOTICES
          Cache-Control: no-cache

        /assets/assets/vodozemac/*
          Cache-Control: no-cache

        /assets/fonts/*
          Cache-Control: public, max-age=604800

        /assets/packages/*
          Cache-Control: public, max-age=86400

        /assets/assets/*
          Cache-Control: public, max-age=86400

        /icons/*
          Cache-Control: public, max-age=604800

        /splash/*
          Cache-Control: public, max-age=604800

        /favicon.png
          Cache-Control: public, max-age=604800

        /manifest.json
          Cache-Control: public, max-age=604800

        # --no-web-resources-cdn serves engine files (skwasm/canvaskit) from
        # this origin instead of gstatic. They are not hash-named, so a long
        # immutable TTL would risk a stale engine pairing against newer Dart
        # code after a Flutter upgrade; one day bounds that window while
        # still skipping most re-downloads.
        /canvaskit/*
          Cache-Control: public, max-age=86400

        EOF
