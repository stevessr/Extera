name: Setup Flutter
description: Installs the pinned Flutter SDK and restores the pub cache.

inputs:
  pub-get:
    description: Run "flutter pub get" once the SDK is ready.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: grep -Ev '^[[:space:]]*(#|$)' .github/workflows/versions.env >>"$GITHUB_ENV"

    # Set before flutter-action so it adopts this location rather than picking
    # its own, which keeps the cache path below correct by construction.
    - name: Pin pub cache location
      shell: bash
      run: echo "PUB_CACHE=$HOME/.pub-cache" >>"$GITHUB_ENV"

    # pub-cache is off because the step below already caches that directory.
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .tool_versions.yaml
        cache: true
        pub-cache: 'false'

    - name: Verify Flutter version
      shell: bash
      run: ./scripts/ci/verify-flutter-version.sh

    # Pub's global cache contains checked-out git dependencies. A fallback
    # cache from a different lockfile can therefore pair a new resolved-ref
    # with stale dependency metadata. Use exact lockfile keys only; a miss is
    # deliberately safer than restoring a cache from another dependency graph.
    - name: Restore pub cache
      uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        key: pub-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool_versions.yaml') }}-${{ hashFiles('pubspec.lock') }}

    - name: Resolve dependencies
      if: ${{ inputs.pub-get == 'true' }}
      shell: bash
      # package_graph.json is project-local generated state. Always regenerate
      # it after resolving the exact git dependency revisions from the lockfile.
      run: |
        rm -rf .dart_tool
        flutter pub get --no-example

    # The animated emoji are immutable generated assets for a given source list
    # and downloader implementation. Avoid running the downloader on cache hits:
    # on hosted runners it otherwise spends over a minute verifying 881 files.
    - name: Restore animated emoji
      id: animated_emoji_cache
      if: ${{ inputs.pub-get == 'true' }}
      uses: actions/cache@v5
      with:
        path: assets/animated_emoji
        key: animated-emoji-${{ hashFiles('lib/config/animated_emoji_data.dart', 'tool/download_animated_emoji.dart') }}

    - name: Download animated emoji
      if: ${{ inputs.pub-get == 'true' && steps.animated_emoji_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: dart run tool/download_animated_emoji.dart

    # One-shot branch hygiene: use the pinned formatter that CI itself runs,
    # then restore this helper from the PR base before committing. The helper
    # therefore never survives in the resulting branch commit.
    - name: Apply one-shot poll formatter
      if: ${{ github.job == 'analyze' }}
      shell: bash
      run: |
        set -euo pipefail
        dart format lib/pages/chat/events/poll_content.dart
        git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1
        git restore --source=FETCH_HEAD -- .github/actions/setup-flutter/action.yml
        git add -A -- lib/pages/chat/events/poll_content.dart .github/actions/setup-flutter/action.yml
        if git diff --cached --quiet; then
          exit 0
        fi
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git commit -m "style: format poll content"
        git push origin "HEAD:${GITHUB_HEAD_REF}"
