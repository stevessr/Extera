name: Setup Flutter
description: Installs the pinned Flutter SDK and restores the pub cache.

inputs:
  pub-get:
    description: Run "flutter pub get" once the SDK is ready.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: grep -Ev '^[[:space:]]*(#|$)' .github/workflows/versions.env >>"$GITHUB_ENV"

    # Every job runs this action, so this is the one place that reliably
    # reports a runner whose cache service is off or unreachable.
    - name: Check cache service
      shell: bash
      run: ./scripts/ci/check-cache.sh

    # Set before flutter-action so it adopts this location rather than picking
    # its own, which keeps the cache path below correct by construction.
    - name: Pin pub cache location
      shell: bash
      run: echo "PUB_CACHE=$HOME/.pub-cache" >>"$GITHUB_ENV"

    # pub-cache is off because the step below already caches that directory,
    # with restore-keys that flutter-action's own pub cache does not have.
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .tool_versions.yaml
        cache: true
        pub-cache: 'false'

    - name: Verify Flutter version
      shell: bash
      run: ./scripts/ci/verify-flutter-version.sh

    - name: Restore pub cache
      uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        # Keep Pub caches isolated by Flutter SDK. Reusing the old cache across
        # Dart/Pub versions can leave package_graph.json inconsistent with the
        # checked-out dependency graph (for example, random_string missing).
        key: pub-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool_versions.yaml') }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool_versions.yaml') }}-

    - name: Resolve dependencies
      if: ${{ inputs.pub-get == 'true' }}
      shell: bash
      # Skip dependency example traversal: it is unneeded for CI and older
      # Pub versions could leave package_graph.json incomplete for transitive
      # packages such as random_string.
      run: flutter pub get --no-example

    # The animated emoji are shipped as assets but not checked in, so every
    # build has to fetch them. The tool skips files it already has, which makes
    # this a no-op on a cache hit.
    - name: Restore animated emoji
      if: ${{ inputs.pub-get == 'true' }}
      uses: actions/cache@v5
      with:
        path: assets/animated_emoji
        key: animated-emoji-${{ hashFiles('lib/config/animated_emoji_data.dart') }}

    - name: Download animated emoji
      if: ${{ inputs.pub-get == 'true' }}
      shell: bash
      run: dart run tool/download_animated_emoji.dart
