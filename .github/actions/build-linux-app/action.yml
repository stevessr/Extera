name: Build Linux app
description: Builds the Flutter Linux desktop bundle for one architecture.

inputs:
  arch:
    description: Target architecture (x64 or arm64).
    required: true
  mode:
    description: Build mode passed to flutter build linux (release or debug).
    required: false
    default: release
  appimage:
    description: Also install appimagetool, needed to package an AppImage afterwards.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-linux-deps
      with:
        appimage: ${{ inputs.appimage }}

    # No prebuilt Flutter archive exists for Linux arm64, so that path installs
    # the SDK from source instead of via subosito/flutter-action.
    - uses: ./.github/actions/setup-flutter
      if: ${{ inputs.arch == 'x64' }}
    - uses: ./.github/actions/setup-flutter-source
      if: ${{ inputs.arch != 'x64' }}

    # cargokit compiles the vodozemac Rust crate during the build.
    - uses: ./.github/actions/setup-rust

    # Build containers have no /dev/fuse, so AppImages must self-extract; the
    # packaging step sets APPIMAGE_EXTRACT_AND_RUN itself.
    - name: Restore appimagetool binary
      if: ${{ inputs.appimage == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.local/bin/appimagetool
        key: appimagetool-${{ runner.os }}-${{ runner.arch }}-continuous

    - name: Install appimagetool
      if: ${{ inputs.appimage == 'true' }}
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        APPIMAGETOOL_INSTALL_DIR="$HOME/.local/bin" ./scripts/ci/install-appimagetool.sh
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"

    - name: Build Linux bundle
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        MODE: ${{ inputs.mode }}
      run: flutter build linux --"$MODE" --target-platform "linux-$ARCH"
