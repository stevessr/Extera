name: Setup Android
description: Installs the JDK and Android SDK components, and restores the Gradle cache.

inputs:
  cache_scope:
    description: Optional scope for architecture-specific Gradle caches.
    required: false
    default: shared

runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: grep -Ev '^[[:space:]]*(#|$)' .github/workflows/versions.env >>"$GITHUB_ENV"

    - name: Install JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: zulu

    # packages defaults to "tools platform-tools", and the obsolete "tools"
    # package drags in the Android Emulator. APK builds only need platform-tools
    # plus the exact SDK/NDK components installed by setup-android-sdk.sh.
    - name: Install Android command line tools
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false

    - name: Install Android SDK components
      shell: bash
      run: ./scripts/ci/setup-android-sdk.sh

    # Gradle's cache is the high-value Android cache. Avoid separately caching
    # the hosted runner's JDK and SDK directories: those caches are large,
    # frequently miss as runner images/tool versions rotate, and duplicate the
    # setup actions' own installation/version resolution work.
    - name: Restore Gradle cache
      uses: actions/cache@v5
      with:
        path: |
          android/.gradle
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_scope }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/gradle.properties', 'pubspec.lock', '.tool_versions.yaml') }}
        # Keep fallback restores within the same ABI. Restoring a multi-gigabyte
        # armv7 cache into an armv8/x86_64 job costs more than the small amount
        # of reusable metadata it contributes and then creates another full
        # architecture-specific cache on save.
        restore-keys: |
          gradle-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_scope }}-
