name: Setup Rust
description: Installs the stable Rust toolchain and restores the cargo caches.

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: https://github.com/dtolnay/rust-toolchain@stable

    # ~/.cargo/bin holds flutter_rust_bridge_codegen, which prepare-web.sh would
    # otherwise recompile every run. Its install tracker lives in .crates.toml /
    # .crates2.json, so those are cached alongside it.
    - name: Restore cargo cache
      uses: https://github.com/actions/cache@v6
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: cargo-${{ runner.os }}-
