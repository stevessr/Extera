name: Build Android APK
description: Builds a flavoured Android APK for one target platform.

inputs:
  target-platform:
    description: Flutter target platform (android-arm, android-arm64, or android-x64).
    required: true
  flavor:
    description: Gradle flavor to build.
    required: false
    default: fRelease
  mode:
    description: Build mode passed to flutter build apk (release or debug).
    required: false
    default: release
  signing:
    description: Write the signing configuration from the keystore inputs before building.
    required: false
    default: 'false'
  keystore-file:
    description: Base64-encoded release keystore (KEYSTORE_FILE secret).
    required: false
    default: ''
  keystore-pass:
    description: Keystore password (KEYSTORE_PASS secret).
    required: false
    default: ''
  key-pass:
    description: Key password (KEY_PASS secret).
    required: false
    default: ''
  key-alias:
    description: Key alias (KEY_ALIAS secret, defaults to "key").
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The packaging step labels artifacts after the ABI, and Gradle caches are
    # scoped per ABI, so map the target platform to its cache scope.
    - name: Resolve ABI cache scope
      id: scope
      shell: bash
      env:
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run: |
        case "$TARGET_PLATFORM" in
          android-arm) echo "scope=armv7" >>"$GITHUB_OUTPUT" ;;
          android-arm64) echo "scope=armv8" >>"$GITHUB_OUTPUT" ;;
          android-x64) echo "scope=x86_64" >>"$GITHUB_OUTPUT" ;;
          *) echo "Unsupported target platform: $TARGET_PLATFORM" >&2; exit 1 ;;
        esac

    - uses: ./.github/actions/setup-android
      with:
        cache_scope: android-${{ steps.scope.outputs.scope }}
    - uses: ./.github/actions/setup-flutter
    # Flutter tool regression #169336 can leave integration_test in the Android
    # GeneratedPluginRegistrant when a later release build uses --no-pub.
    # Refresh platform build configuration after pub get before that build.
    - name: Refresh Flutter build configuration
      shell: bash
      run: flutter build --config-only
    # cargokit compiles the vodozemac Rust crate during the Gradle build, so
    # this action needs the toolchain and its cache as much as anything else.
    - uses: ./.github/actions/setup-rust

    - name: Write signing configuration
      if: ${{ inputs.signing == 'true' || inputs.target-platform == 'android-arm64' }}
      shell: bash
      env:
        # Composite action steps cannot read the secrets context; callers pass
        # the secrets in as inputs.
        KEYSTORE_FILE: ${{ inputs.keystore-file }}
        KEYSTORE_PASS: ${{ inputs.keystore-pass }}
        KEY_PASS: ${{ inputs.key-pass }}
        KEY_ALIAS: ${{ inputs.key-alias }}
      run: ./scripts/ci/write-android-signing.sh

    - name: Build APK
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
        MODE: ${{ inputs.mode }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run: |
        # Release-path smoke test for this temporary validation branch only.
        if [ "$TARGET_PLATFORM" = android-arm64 ]; then
          FLAVOR=fRelease
          MODE=release
        fi
        flutter build apk --flavor "$FLAVOR" --"$MODE" --no-pub --target-platform "$TARGET_PLATFORM"

    - name: Verify release APK smoke artifact
      if: ${{ inputs.target-platform == 'android-arm64' }}
      shell: bash
      run: |
        ./scripts/ci/package-artifacts.sh apk v0.0.0-ci-smoke armv8
        ./scripts/ci/verify-apk-signature.sh artifacts/*.apk
