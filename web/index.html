<!DOCTYPE html>
<html>

<head>
  <!-- ============================================================ -->
  <!-- COOP/COEP headers for SharedArrayBuffer (vodozemac/wasm)     -->
  <!-- These MUST be set as HTTP response headers on your server:   -->
  <!--   Cross-Origin-Opener-Policy: same-origin                     -->
  <!--   Cross-Origin-Embedder-Policy: require-corp                  -->
  <!--                                                               -->
  <!-- For nginx:                                                    -->
  <!--   add_header Cross-Origin-Opener-Policy "same-origin";        -->
  <!--   add_header Cross-Origin-Embedder-Policy "require-corp";     -->
  <!--                                                               -->
  <!-- For Cloudflare Workers, add to the response:                  -->
  <!--   response.headers.set('Cross-Origin-Opener-Policy','same-origin')  -->
  <!--   response.headers.set('Cross-Origin-Embedder-Policy','require-corp') -->
  <!--                                                               -->
  <!-- For Flutter dev server, use a proxy or dhttpd with headers.   -->
  <!-- ============================================================ -->
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The cutest messenger in the Matrix network.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Extera">
  <link rel="apple-touch-icon" href="icons/128.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Extera</title>
  <link rel="manifest" href="manifest.json">
  <!-- Warm the vodozemac crypto bundle while the Flutter engine and the
       main dart2wasm module are still downloading. Without these hints the
       ~900 KB of wasm + glue is only fetched after Dart has booted,
       serializing one extra round trip into startup. The loader injects a
       classic script for the glue and fetch()es the wasm module, which
       these preload entries match. -->
  <link rel="preload" href="assets/assets/vodozemac/vodozemac_bindings_dart.js" as="script">
  <link rel="preload" href="assets/assets/vodozemac/vodozemac_bindings_dart_bg.wasm" as="fetch" crossorigin>

  <!-- Warm the icon font so first-frame chrome never paints blank glyphs;
       the engine only discovers it after boot (~300 ms in on a warm LAN). -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>

  <!-- Start the selected Dart bundle at HTML parse time. Without this, the
       ~13 MB main.dart.wasm download waits for flutter_bootstrap.js to
       download, parse and run feature detection first - one serialized hop on
       the critical path. This mirrors the loader's own build selection: Blink
       engines passing the identical WasmGC probe get the dart2wasm pair
       (modulepreload for the JS runtime, preload-as-fetch for the module -
       exactly the request shapes _loadWasmEntrypoint later issues, so both
       come from the preload cache with no duplicate fetches); every other
       browser falls back to the dart2js build it would run anyway. A wrong
       guess at worst cancels one unused speculative request. -->
  <script>
    (() => {
      const link = (rel, as, href, cors) => {
        const el = document.createElement("link");
        el.rel = rel;
        if (as) el.as = as;
        if (href) el.href = href;
        if (cors) el.crossOrigin = "anonymous";
        document.head.appendChild(el);
      };
      try {
        // Same probe the loader runs before selecting the wasm build.
        const gcProbe = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
        const hasWasmGC = typeof WebAssembly === "object" && WebAssembly.validate(gcProbe);
        const isBlink = navigator.vendor === "Google Inc." || navigator.userAgent.includes("Edg/");
        if (isBlink && hasWasmGC) {
          link("modulepreload", "", "main.dart.mjs");
          link("preload", "fetch", "main.dart.wasm", true);
          // Skwasm is the only renderer of the wasm build; threaded and
          // single-threaded modes load the same two files.
          const gl = document.createElement("canvas").getContext("webgl2")
            || document.createElement("canvas").getContext("webgl");
          if (gl) {
            link("preload", "script", "canvaskit/skwasm.js");
            link("preload", "fetch", "canvaskit/skwasm.wasm", true);
          }
        } else {
          link("preload", "script", "main.dart.js");
          // The JS fallback renders with the Chromium-flavored canvaskit.
          link("preload", "script", "canvaskit/chromium/canvaskit.js");
          link("preload", "fetch", "canvaskit/chromium/canvaskit.wasm", true);
        }
      } catch (_) {}
    })();
  </script>

  <link rel="stylesheet" type="text/css" href="splash/style.css">
</head>

<body>
  <picture id="splash">
    <source
      srcset="icons/64.png 1x,icons/128.png 2x"
      media="(prefers-color-scheme: light) or (prefers-color-scheme: no-preference)">
    <source
        srcset="icons/64.png 1x,icons/128.png 2x"
      media="(prefers-color-scheme: dark)">
    <img class="center" src="icons/128.png" />
  </picture>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
